buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['ChatCallkit_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ChatCallkit_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

def getRNVersion() {
    def rnPackageJsonPath = null
    try {
        rnPackageJsonPath = ["node", "--print", "require.resolve('react-native/package.json')"]
            .execute(null, rootDir)
            .text
            .trim()

        def packageJson = new groovy.json.JsonSlurper().parseText(new File(rnPackageJsonPath).text)
        def version = packageJson.version

        println("React Native version found: ${version}")
        return version
    } catch (Exception e) {
        println("Error determining React Native version: ${e.message}")
        return null
    }
}

def isReactNative076OrHigher() {
    def rnVersion = getRNVersion()
    if (rnVersion != null) {
        def versionParts = rnVersion.split("\\.")
        if (versionParts.size() >= 2) {
            def major = versionParts[0].toInteger()
            def minor = versionParts[1].toInteger()
            return (major > 0 || (major == 0 && minor >= 76))
        }
    }
    return false
}

android {
  if (supportsNamespace()) {
    namespace "com.chatcallkit"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    buildConfigField "boolean", "IS_REACT_NATIVE_076_OR_HIGHER", "${isReactNative076OrHigher()}"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "src/newarch",
            "${project.buildDir}/generated/source/codegen/java"
          ]
      } else {
          java.srcDirs += [
            "src/oldarch"
          ]
      }

      if (isReactNative076OrHigher()) {
          java.srcDirs += ["src/rn076"]
      } else {
          java.srcDirs += ["src/rn072"]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "ChatCallkit"
    codegenJavaPackageName = "com.chatcallkit"
  }
}
