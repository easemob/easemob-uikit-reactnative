pre-commit:
  parallel: true
  commands:
    lint:
      files: git diff --name-only --staged
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn lintcheck
    types:
      files: git diff --name-only --staged
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn typecheck
    gitleaks:
      run: gitleaks detect -c '.gitleaksconfig.toml' -s . -r gitleaks.log
    circular-dep-check:
      files: git diff --name-only --staged
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn circular-dep-check

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: yarn commitlint --edit
